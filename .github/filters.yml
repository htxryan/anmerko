# Shared toolchain and CI changes validate every target.
common: &common
  - '.github/workflows/check.yml'
  - 'Taskfile.yml'
  - '.github/workflows/desktop.yml'
  - '.github/workflows/release.yml'
  - '.github/workflows/release-validation.yml'
  - 'scripts/ci/ci-policy.mjs'
  - 'scripts/ci/continue-release.mjs'
  - 'scripts/runners/**'
  - 'scripts/release/release-*.mjs'
  - 'scripts/release/archive-release-candidate.mjs'
  - '.github/filters.yml'
  - '.github/actionlint.yaml'
  - 'scripts/ci/reuse-ci.mjs'
  - 'package.json'
  - 'package-lock.json'
  - '.npmrc'
  - '.gitattributes'

# Both browsers share these build inputs. Installer approval is independent.
extension: &extension
  - *common
  - 'src/**'
  - 'public/**'
  - 'scripts/extension/build.mjs'
  - 'scripts/extension/build-version.mjs'
  - 'scripts/extension/browser-targets.mjs'
  - 'scripts/extension/package.mjs'
  - 'tsconfig.json'

lint:
  - *common
  - '**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,astro,vue,svelte}'
  - '**/tsconfig*.json'
  - '.oxlintrc.json'
  - '.oxlintignore'
  - '.gitignore'

chrome:
  - *extension
  - 'tests/chromium/**'
  - 'tests/desktop/**'
  - 'tests/shared/**'
  - 'scripts/browsers/test-desktop.mjs'
  - 'scripts/browsers/check-desktop-payloads.mjs'
  - 'tests/tooling/**'
  # The installer suite also rebuilds Firefox's extracted review-source archive.
  - 'scripts/extension/package-firefox-source.mjs'
  - 'tests/playwright.config.ts'
  - 'scripts/browsers/install-chrome.mjs'
  - 'scripts/browsers/demo.mjs'
  - 'tests/fixtures/demo/**'
  - 'tests/fixtures/component-context/**'
  - 'scripts/browsers/setup-component-fixtures.mjs'

firefox:
  - *extension
  - 'tests/firefox/**'
  - 'tests/android/**'
  - 'tests/shared/**'
  - 'scripts/browsers/web-ext.mjs'
  - 'scripts/release/sign-firefox.mjs'
  - 'scripts/extension/package-firefox-source.mjs'
  - 'scripts/browsers/check-desktop-payloads.mjs'
  - 'site/firefox-release.json'
  - 'site/installers/*.xpi'
  - 'tests/fixtures/demo/**'
  - 'tests/fixtures/component-context/**'
  - 'scripts/browsers/setup-component-fixtures.mjs'

site:
  - '.github/workflows/deploy.yml'
  - *common
  - 'releases/**'
  - 'scripts/release/approved-release.mjs'
  - 'scripts/release/verify-approved-release.mjs'
  - 'scripts/deployment/deployment-eligibility.mjs'
  - 'public/icons/128.png'
  # The demo compiles the same UI components and styles as the extension.
  - 'src/**'
  # Published Markdown/MDX is compiled by Astro; repository docs need no build.
  - 'site/**'
  - 'scripts/site/build-support-site.mjs'
  - 'tests/site/**'
  - 'tests/support/**'
  - 'tests/playwright.site.config.ts'
  - 'scripts/site/build-site.mjs'
  - 'scripts/site/serve-site.mjs'
  - 'scripts/deployment/deploy-site-preview.mjs'
  - 'scripts/deployment/verify-site-deployment.mjs'
  - 'scripts/deployment/capture-deployment-state.mjs'
  - 'tests/deployment/**'

# These changes can affect browser integration or the release trust boundary.
highrisk:
  - *common
  - 'public/**'
  - 'src/platform.ts'
  - 'src/background.ts'
  - 'src/extension-*.ts'
  - 'src/runtime.ts'
  - 'src/sidebar*'
  # Site, media and reporting helpers do not change browser behavior.
  - 'scripts/extension/build.mjs'
  - 'scripts/extension/build-version.mjs'
  - 'scripts/extension/browser-targets.mjs'
  - 'scripts/extension/package*.mjs'
  - 'scripts/browsers/install-chrome.mjs'
  - 'scripts/browsers/web-ext.mjs'
  - 'scripts/release/sign-firefox.mjs'
  - 'scripts/browsers/check-desktop-payloads.mjs'
  - 'scripts/browsers/test-desktop.mjs'
  - 'scripts/browsers/demo.mjs'
  - 'scripts/release/store-api.mjs'
  - 'tests/shared/**'
  - 'tests/desktop/**'
  - 'tests/firefox/**'
  - 'tests/android/**'
  - 'site/installers/**'
  - 'site/firefox-release.json'
  - 'releases/**'
  - 'tests/fixtures/component-context/**'
  - 'scripts/browsers/setup-component-fixtures.mjs'
  - 'src/react-context-probe.ts'
  - 'src/vue-context-probe.ts'
  - 'src/angular-context-probe.ts'
  - 'src/component-context*.ts'

releasegate:
  # These files decide whether proof runs and which attestation it accepts.
  - '.github/workflows/check.yml'
  - '.github/filters.yml'
  - 'scripts/ci/ci-policy.mjs'
  - 'scripts/ci/continue-release.mjs'
  - 'scripts/ci/reuse-ci.mjs'
  - '.github/workflows/release.yml'
  - '.github/workflows/release-validation.yml'
  - '.github/workflows/desktop.yml'
  - 'scripts/release/release-*.mjs'
  - 'scripts/release/archive-release-candidate.mjs'
  - 'scripts/browsers/check-desktop-payloads.mjs'
  # Test-only edits run in Changed paths; they do not rebuild an old release.
