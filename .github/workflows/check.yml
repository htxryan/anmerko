name: Check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Deploy has its own non-cancelling concurrency group. Superseded CI can stop.
  cancel-in-progress: true
jobs:
  changes:
    name: Changed paths
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      lint: ${{ steps.scope.outputs.scope == 'full' && 'true' || steps.filter.outputs.lint }}
      chrome: ${{ steps.scope.outputs.scope == 'full' && 'true' || steps.filter.outputs.chrome }}
      firefox: ${{ steps.scope.outputs.scope == 'full' && 'true' || steps.filter.outputs.firefox }}
      site: ${{ steps.filter.outputs.site }}
      reuse: ${{ steps.pr-check.outputs.reuse }}
      scope: ${{ steps.scope.outputs.scope }}
      matrix: ${{ steps.scope.outputs.matrix }}
      releasegate: ${{ steps.filter.outputs.releasegate }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reject tracked ignored files
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo '::error::Ignored files are tracked. Remove them from Git before merging.'
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reject private source data
        run: node scripts/ci/check-public-source.mjs
      - run: node --test tests/ci/*.test.mjs tests/release/*.test.mjs
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # PRs compare against their base; main pushes compare against the
          # commit before the push, including every commit in a multi-commit push.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/filters.yml
      - name: Select required validation scope
        id: scope
        env:
          HIGH_RISK: ${{ steps.filter.outputs.highrisk }}
        run: node scripts/ci/ci-policy.mjs
      - name: Record the checkout identity and validation scope
        env:
          VALIDATION_SCOPE: ${{ steps.scope.outputs.scope }}
        run: node scripts/ci/reuse-ci.mjs record
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-source-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/source.json
      - name: Verify equivalent PR checks before repeating them on main
        if: github.event_name == 'push'
        id: pr-check
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_SCOPE: ${{ steps.scope.outputs.scope }}
        run: node scripts/ci/reuse-ci.mjs


  # Keep the required check names and skip jobs, not the workflow, so docs-only
  # PRs can merge. A verified identical PR tree can satisfy main's extension
  # checks. Manual runs, failed detection, and unverified trees run normally.
  lint:
    name: Lint and types
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  chrome:
    name: Chrome
    needs: [changes, desktop, release-proof]
    if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.chrome == 'true') }}
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      VALIDATION_SCOPE: ${{ needs.changes.outputs.scope || 'full' }}
    steps:
      - name: Require release-gate proof when applicable
        if: ${{ needs.changes.result != 'success' || (github.event_name == 'pull_request' && needs.changes.outputs.releasegate == 'true' && needs.release-proof.result != 'success') }}
        run: exit 1
      - name: Require the shared desktop browser matrix
        if: needs.desktop.result != 'success'
        run: |
          echo '::error::The shared Chrome, Edge, and Firefox matrix failed. Inspect the individual browser steps; this aggregate alone does not identify the failing browser.'
          exit 1
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.15.0
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: |
            package-lock.json
            tests/fixtures/component-context/package-lock.json
            tests/fixtures/component-context/angular/package-lock.json
      - run: npm ci
      - run: npm run test:context-fixtures:setup
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: anmerko-desktop-chromium-*
          path: artifacts/desktop-ci
      - run: node scripts/browsers/check-desktop-payloads.mjs artifacts/desktop-ci --edge
      - run: npm run package
      - run: npm run test:installer
      - run: npm test
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: anmerko-chrome
          retention-days: 7
          path: |
            artifacts/
            !artifacts/desktop-ci/**
            test-results/

  firefox:
    name: Firefox / Android
    needs: [changes, desktop, android, release-proof]
    if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.firefox == 'true') }}
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    env:
      VALIDATION_SCOPE: ${{ needs.changes.outputs.scope || 'full' }}
    steps:
      - name: Require release-gate proof when applicable
        if: ${{ needs.changes.result != 'success' || (github.event_name == 'pull_request' && needs.changes.outputs.releasegate == 'true' && needs.release-proof.result != 'success') }}
        run: exit 1
      - name: Require the shared desktop browser matrix
        if: needs.desktop.result != 'success'
        run: |
          echo '::error::The shared Chrome, Edge, and Firefox matrix failed. Inspect the individual browser steps; this aggregate alone does not identify the failing browser.'
          exit 1
      - name: Require the Firefox for Android emulator suite
        if: needs.android.result != 'success'
        run: |
          echo '::error::Firefox for Android failed in the emulator. Inspect the "Firefox Android emulator" job.'
          exit 1
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: anmerko-desktop-firefox-*
          path: artifacts/firefox-ci
      - run: node scripts/browsers/check-desktop-payloads.mjs artifacts/firefox-ci --firefox
      # Firefox desktop and Android use the same build and manifest. Packaging
      # runs Mozilla's linter with warnings treated as errors.
      - run: npm run package:firefox
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: anmerko-firefox-android
          retention-days: 7
          path: |
            artifacts/
            !artifacts/firefox-ci/**

  android:
    name: Firefox Android emulator
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.firefox == 'true') }}
    # The x86_64 emulator needs KVM, which hosted x64 Linux runners provide and
    # the local ARM64 runner cannot, so this job always uses a hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:firefox
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test release Firefox for Android in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: npm run test:android
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: anmerko-firefox-android-emulator
          retention-days: 7
          path: artifacts/android-*/

  # The same reusable workflow validates PRs and explicit release candidates.
  desktop:
    name: Desktop browsers (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.reuse != 'true' && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.chrome == 'true' || needs.changes.outputs.firefox == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.matrix || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        # Windows definitions are retained, but never scheduled during issue #58's hold.
        exclude:
          - os: windows-latest
    uses: ./.github/workflows/desktop.yml
    with:
      os: ${{ matrix.os }}
      chrome: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.chrome == 'true') }}
      firefox: ${{ (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.firefox == 'true') }}

  site:
    name: Site
    permissions:
      contents: read
      actions: read
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.site == 'true') }}
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    env:
      VALIDATION_SCOPE: ${{ needs.changes.outputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/deployment/*.test.mjs
      - name: Verify approved release transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-approved-release.mjs
      - run: npm run site:build
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run site:check
      - run: npm run site:test
      - name: Upload tested production assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: anmerko-production
          retention-days: 7
          overwrite: true
          if-no-files-found: error
          path: |
            site/dist/
            artifacts/store-site/
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: anmerko-site
          retention-days: 7
          path: |
            site/dist/
            artifacts/
            test-results/

  release-proof:
    name: Release proof
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.releasegate == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/release-validation.yml
    with:
      # Base is a trusted main commit with a completed Check; using it avoids a
      # circular dependency on this PR's Check while preserving candidate coverage.
      source: ${{ github.event.pull_request.base.sha }}
      proof: true

  continue-release:
    name: Continue automated release
    needs: [changes, lint, chrome, firefox, desktop, site, release-proof]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.repository == 'htxryan/anmerko' &&
      (github.ref_name == 'main' || startsWith(github.ref_name, 'codex/release-source-') ||
      startsWith(github.ref_name, 'codex/automated-release-')) &&
      needs.changes.result == 'success' && needs.lint.result == 'success' &&
      needs.chrome.result == 'success' && needs.firefox.result == 'success' &&
      needs.desktop.result == 'success' && needs.site.result == 'success'
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(github.event.repository.private && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resume pending release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/continue-release.mjs
