name: Release
run-name: Release anmerko
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional three-part recovery/adoption version; normally blank
        required: false
        type: string
      adopt-existing:
        description: Adopt verified existing bytes for the override
        required: false
        default: false
        type: boolean
      resume-only:
        description: Resume the active release only; callbacks and schedules always use this behavior
        required: false
        default: false
        type: boolean
  schedule:
    # Check/Deploy callbacks continue immediately; this is a recovery/store poll.
    - cron: '22 * * * *'
  workflow_run:
    workflows: [Check, Deploy]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  release:
    name: One-button release
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'Check' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'codex/release-source-') ||
      startsWith(github.event.workflow_run.head_branch, 'codex/automated-release-'))) ||
      (github.event.workflow_run.name == 'Deploy' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ${{ fromJSON(github.event.repository.private && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    concurrency:
      group: briefmark-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # The resolver uses Node built-ins and gh. Install only for ready work.
      - name: Resume the active release or supersede its deployed website with newer main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION_OVERRIDE: ${{ inputs.version }}
          ADOPT_EXISTING: ${{ inputs.adopt-existing || false }}
          RELEASE_RESUME_ONLY: ${{ inputs.resume-only || false }}
        run: node scripts/release-automation.mjs resolve
      - name: Stop when there is no pending work
        if: steps.release.outputs.run != 'true'
        run: echo 'No pending release or extension payload change.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check will continue asynchronously
        if: steps.release.outputs.run == 'true' && steps.release.outputs.ready != 'true'
        run: echo 'Waiting for the exact main Check; continuation will resume automatically.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7.0.1
        if: steps.release.outputs.ready == 'true'
        with:
          ref: ${{ steps.release.outputs.source }}
          persist-credentials: false
      - run: npm ci
        if: steps.release.outputs.ready == 'true'
      - name: Restore immutable packages and state
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ steps.release.outputs.tag }}' --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern 'release-candidate.tgz' --pattern 'state-*.json'
          tar -xzf artifacts/release-candidate.tgz -C artifacts
      - name: Download exact full Check reports
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.resume != 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ steps.release.outputs.artifact-prefix }}-desktop-*
          run-id: ${{ steps.release.outputs.check-run }}
          github-token: ${{ github.token }}
          path: artifacts/check-reports
      - name: Build immutable three-part packages once
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run package && npm run package:firefox
      - name: Build Firefox website signing variant and source
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.resume != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}.1
        run: npm run package:firefox
      - name: Verify packages against Linux and local macOS Check payloads
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.resume != 'true'
        env:
          RELEASE_SOURCE: ${{ steps.release.outputs.source }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CHECK_RUN: ${{ steps.release.outputs.check-run }}
          ADOPT_EXISTING: ${{ steps.release.outputs.adopt || inputs.adopt-existing || false }}
          RELEASE_RUN: ${{ steps.release.outputs.release-run }}
          RELEASE_ATTEMPT: ${{ steps.release.outputs.release-attempt }}
        run: node scripts/release-automation.mjs verify-candidate
      - uses: actions/checkout@v7.0.1
        if: steps.release.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - name: Persist the atomic candidate before any external mutation
        if: steps.release.outputs.ready == 'true' && steps.release.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/archive-release-candidate.mjs artifacts/state-001.json artifacts/release-candidate.tgz
          gh release upload '${{ steps.release.outputs.tag }}' artifacts/release-candidate.tgz --repo "$GITHUB_REPOSITORY"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.release.outputs.ready == 'true'
        id: release-app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      - name: Restore controller dependencies without running package hooks
        if: steps.release.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Advance independent website and store tracks
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ steps.release.outputs.source }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          RELEASE_PR_TOKEN: ${{ steps.release-app.outputs.token }}
        run: node scripts/release-deliver.mjs
      - name: Retain promotion evidence in its authorizing run
        if: steps.release.outputs.ready == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-evidence-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: artifacts/release-evidence.json
      - name: Continue after authorizing evidence is retained
        if: steps.release.outputs.ready == 'true' && hashFiles('artifacts/release-evidence.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/continue-release.mjs
