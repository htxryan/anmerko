name: Deploy
run-name: Deploy ${{ github.event.workflow_run.head_sha || format('release Check {0}', inputs.check-run) }}
on:
  workflow_dispatch:
    inputs:
      check-run:
        description: Successful explicit Check run for the exact release promotion head
        required: true
        type: string
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
defaults:
  run:
    # Preserve Wrangler failures when capturing output through tee.
    shell: bash
# Never interrupt a deployment between the two Workers. Older completed Check
# runs must also pass the freshness guard before they can publish.
concurrency:
  group: briefmark-production
  cancel-in-progress: false
jobs:
  eligible:
    name: Check deployment eligibility
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tested.outputs.deploy || steps.explicit.outputs.deploy }}
      source: ${{ steps.release.outputs.source || github.event.workflow_run.head_sha }}
      check-run: ${{ steps.release.outputs.check-run || github.event.workflow_run.id }}
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve explicit release Check
        if: github.event_name == 'workflow_dispatch'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN: ${{ inputs.check-run }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          assert.match(process.env.CHECK_RUN, /^\d+$/);
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.CHECK_RUN}`]));
          assert.equal(run.path, '.github/workflows/check.yml'); assert.equal(run.event, 'workflow_dispatch');
          assert.equal(run.status, 'completed'); assert.equal(run.conclusion, 'success');
          assert.equal(run.repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          const main = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`]));
          assert.equal(run.head_sha, main.object.sha, 'Release promotion is not current main');
          appendFileSync(process.env.GITHUB_OUTPUT, `source=${run.head_sha}\ncheck-run=${run.id}\n`);
          NODE
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Require tested website changes
        id: tested
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN: ${{ github.event.workflow_run.id }}
        run: node scripts/deployment/deployment-eligibility.mjs site-tested
      - name: Explicit release promotion is deployable
        if: github.event_name == 'workflow_dispatch'
        run: echo 'deploy=true' >> "$GITHUB_OUTPUT"
        id: explicit
  deploy:
    name: Deploy production
    needs: eligible
    if: needs.eligible.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    environment:
      name: production
      url: https://anmerko.com
    env:
      SOURCE_SHA: ${{ needs.eligible.outputs.source }}
      CI: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.eligible.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          # Do not restore caches populated by a less privileged workflow.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Download the exact successful Check run's assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: anmerko-production
          run-id: ${{ needs.eligible.outputs.check-run }}
          github-token: ${{ github.token }}
          path: release
      - name: Validate both deployment configurations
        run: |
          npx --no-install wrangler deploy --config site/wrangler.jsonc --assets release/site/dist --dry-run
          npx --no-install wrangler deploy --config site/support/wrangler.jsonc --assets release/artifacts/store-site --dry-run
      - name: Skip a superseded main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment/deployment-eligibility.mjs
      - name: Verify approved release before publication
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/verify-approved-release.mjs
          cmp releases/approved.json release/site/dist/release-manifest.json
      - name: Publish both Workers
        if: steps.current.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is missing from the production environment.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing from the production environment.'
            exit 1
          fi
          mkdir -p artifacts/deployment
          cp release/site/dist/release-manifest.json artifacts/deployment/approved.json
          node scripts/deployment/capture-deployment-state.mjs
          npx --no-install wrangler deploy --config site/wrangler.jsonc --assets release/site/dist --message "main $SOURCE_SHA" | tee artifacts/deployment/site.txt
          npx --no-install wrangler deploy --config site/support/wrangler.jsonc --assets release/artifacts/store-site --message "main $SOURCE_SHA" | tee artifacts/deployment/support.txt
      - name: Verify public routes and exact asset bytes
        if: steps.current.outputs.publish == 'true'
        run: |
          node scripts/deployment/verify-site-deployment.mjs release > artifacts/deployment/verification.json
          echo "Deployed and verified $SOURCE_SHA at https://anmerko.com." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: artifacts/deployment/

  continue-release:
    name: Continue automated release
    needs: deploy
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.deploy.result == 'success' &&
      (github.repository == 'htxryan/briefmark' || github.repository == 'htxryan/anmerko') && github.ref_name == 'main'
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(github.event.repository.private && vars.LINUX_RUNNER_MODE != 'hosted' && '["self-hosted","Linux","ARM64","macbook-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Resume pending release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f resume-only=true
