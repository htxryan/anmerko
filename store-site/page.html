<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="anmerko help, privacy, and data handling.">
  {{canonical}}
  <title>{{title}} · anmerko</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; --ink: #192332; --muted: #546173; --blue: #345ee9; --line: #dce2eb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafbfc; color: var(--ink); font: 17px/1.65 system-ui, sans-serif; }
    a { color: var(--blue); text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 5px; }
    .skip { position: absolute; top: -100px; }
    .skip:focus { top: 8px; background: white; padding: 8px; }
    header, main, footer { max-width: 800px; margin: auto; padding: 24px; }
    header { display: flex; gap: 24px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); text-decoration: none; }
    nav { display: flex; gap: 20px; font-size: 15px; }
    h1 { font-size: clamp(32px, 6vw, 44px); line-height: 1.15; letter-spacing: -.035em; margin: 24px 0; }
    h2 { font-size: 22px; line-height: 1.3; margin: 36px 0 12px; }
    h3 { font-size: 18px; }
    p, ul, ol { margin: 12px 0 20px; }
    li { margin: 8px 0; }
    code { font-size: .9em; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 12px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; margin-top: 24px; }
    @media (max-width: 400px) { header { flex-wrap: wrap; gap: 12px; } th, td { padding: 10px 4px; } }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <a class="brand" href="/support/" aria-label="anmerko help home"><svg width="32" height="32" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="34" fill="#345ee9"/><path d="M35 86 86 35M40 35h46v46" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>anmerko</a>
    <nav aria-label="Help navigation"><a href="/support/">Help</a><a href="/support/privacy/">Privacy</a></nav>
  </header>
  <main id="content"><h1>{{title}}</h1>{{content}}</main>
  <footer>anmerko · Website feedback that stays in your browser.</footer>
</body>
</html>
